# PetPal CI：格式化、静态检查、单元测试、依赖漏洞扫描
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: petpal

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: petpal/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: petpal/src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Frontend — Svelte/TS 检查（svelte-check）
        run: npm run check

      - name: Frontend — 单元测试（Vitest）
        run: npm run test

      - name: Rust — 格式化检查（rustfmt）
        working-directory: petpal/src-tauri
        run: cargo fmt --all -- --check

      - name: Rust — 单元测试
        working-directory: petpal/src-tauri
        run: cargo test --all-features

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Rust — 依赖漏洞扫描（cargo audit）
        working-directory: petpal/src-tauri
        run: cargo audit
